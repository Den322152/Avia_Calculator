<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AVIA CALCULATOR</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a2a43'/%3E%3Crect x='0' y='0' width='100' height='14' fill='%23c8102e'/%3E%3Ctext x='50' y='52' font-family='Arial, sans-serif' font-size='24' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='0'%3EAVIA%3C/text%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='12' font-weight='700' fill='%2393c5fd' text-anchor='middle' letter-spacing='0'%3ECALCULATOR%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a2a43'/%3E%3Crect x='0' y='0' width='100' height='14' fill='%23c8102e'/%3E%3Ctext x='50' y='52' font-family='Arial, sans-serif' font-size='24' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='0'%3EAVIA%3C/text%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='12' font-weight='700' fill='%2393c5fd' text-anchor='middle' letter-spacing='0'%3ECALCULATOR%3C/text%3E%3C/svg%3E">

  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);
      overflow-x: hidden;
    }
    
    .app {
      width: 100%;
      max-width: 480px;
      padding: 20px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: max-width 0.3s ease;
      padding-bottom: 20px;
    }

    /* === Шапка === */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 0 0 4px;
    }
    .title-badge {
      position: relative;
      width: 100%;
      padding: 16px 20px 14px;
      background: linear-gradient(135deg, #0a2a43 0%, #0f3a5f 100%);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 6px 20px -6px rgba(10, 42, 67, 0.8);
    }
    .title-badge::before {
      content: '';
      position: absolute;
      right: -20px;
      bottom: -30px;
      width: 120px;
      height: 120px;
      background: #c8102e;
      border-radius: 50%;
      opacity: 0.18;
      transform: rotate(-15deg);
    }
    .title-badge::after {
      content: '';
      position: absolute;
      left: -30px;
      top: -30px;
      width: 100px;
      height: 100px;
      background: #3b82f6;
      border-radius: 50%;
      opacity: 0.12;
    }
    .title-main {
      position: relative;
      z-index: 1;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
    }
    .title-main .accent {
      color: #c8102e;
      position: relative;
      display: inline-block;
    }
    .title-main .accent::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 3px;
      background: #c8102e;
      border-radius: 2px;
      transform: skewX(-20deg);
    }
    .title-sub {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      font-size: 0.62rem;
      letter-spacing: 4px;
      color: #93c5fd;
      text-transform: uppercase;
      font-weight: 600;
    }
    .credit {
      font-size: 0.65rem;
      color: #475569;
      letter-spacing: 0.6px;
      text-align: center;
    }

    /* === Главные вкладки === */
    .main-tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 2px;
    }
    .main-tab-btn {
      flex: 1;
      padding: 10px 2px;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: #94a3b8;
      font-size: clamp(0.55rem, 2vw, 0.65rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .main-tab-btn:active {
      transform: scale(0.95);
      background: #334155;
    }
    .main-tab-btn.active {
      background: #c8102e;
      border-color: #c8102e;
      color: #ffffff;
      box-shadow: 0 3px 8px -3px rgba(200, 16, 46, 0.4);
    }
    .main-tab-btn.active:active {
      background: #a00c24;
    }

    /* === Подвкладки (Fuel) === */
    .sub-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 4px;
    }
    .sub-tab-btn {
      flex: 1;
      padding: 6px 8px;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 10px;
      color: #94a3b8;
      font-size: clamp(0.6rem, 2vw, 0.7rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .sub-tab-btn:active {
      transform: scale(0.95);
      background: #334155;
    }
    .sub-tab-btn.active {
      background: #c8102e;
      border-color: #c8102e;
      color: #ffffff;
      box-shadow: 0 3px 8px -3px rgba(200, 16, 46, 0.4);
    }
    .sub-tab-btn.active:active {
      background: #a00c24;
    }

    /* === Общие стили === */
    .main-tab-content { display: none; flex-direction: column; gap: 14px; }
    .main-tab-content.active { display: flex; }
    .sub-tab-content { display: none; flex-direction: column; gap: 14px; }
    .sub-tab-content.active { display: flex; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      scroll-margin-top: 20px;
    }
    .field label {
      font-size: clamp(0.7rem, 2vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #94a3b8;
      text-transform: uppercase;
      padding-left: 2px;
      transition: color 0.2s;
    }
    .field input, .field select {
      width: 100%;
      padding: 16px 18px;
      background: #1e293b;
      border: 1.5px solid #334155;
      border-radius: 16px;
      color: #f8fafc;
      font-size: clamp(1.1rem, 3vw, 1.25rem);
      font-weight: 600;
      text-align: right;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.2s, color 0.2s;
      font-variant-numeric: tabular-nums;
      appearance: none;
    }
    .field input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }
    .field select {
      text-align: left;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: left 18px center;
      background-size: 16px;
      padding-left: 44px;
    }
    .field input:read-only {
      color: #93c5fd;
      border-color: #1e40af;
      background: #172033;
    }
    .field input[type=number]::-webkit-outer-spin-button,
    .field input[type=number]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .field input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    
    .field input::placeholder {
      color: #475569;
      font-weight: 400;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      width: 100%;
    }
    
    .input-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .input-row .field {
      flex: 1;
    }

    /* === Подсветки === */
    .field.field-green label { color: #86efac; }
    .field.field-green input {
      border-color: #22c55e;
      background: #14281d;
      color: #86efac;
      cursor: default;
    }
    
    .field.field-blue-active label { color: #bfdbfe; }
    .field.field-blue-active input,
    .field.field-blue-active input:read-only {
      background: #0f2946;
      border-color: #2563eb;
      color: #bfdbfe;
      box-shadow: 0 0 0 1.5px #3b82f6, 0 4px 12px -4px rgba(59, 130, 246, 0.3);
    }
    .field.field-blue-active input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 1.5px #60a5fa, 0 0 0 5px rgba(59, 130, 246, 0.2);
    }

    .field.field-green-active label { color: #bbf7d0; }
    .field.field-green-active input {
      background: #0a3d1f;
      border-color: #16a34a;
      color: #bbf7d0;
      cursor: default;
      box-shadow: 0 0 0 1.5px #22c55e, 0 4px 12px -4px rgba(34, 197, 94, 0.3);
    }

    .field.field-red-active label { color: #fecaca; }
    .field.field-red-active input,
    .field.field-red-active input:read-only {
      background: #450a0a;
      border-color: #dc2626;
      color: #fecaca;
      box-shadow: 0 0 0 1.5px #ef4444, 0 4px 12px -4px rgba(239, 68, 68, 0.3);
    }

    .divider {
      margin: 8px 0 4px;
      height: 1px;
      background: #334155;
      border: none;
      width: 100%;
    }

    .reset-btn {
      margin-top: 8px;
      width: 100%;
      padding: 16px 18px;
      background: transparent;
      border: 1.5px solid #475569;
      border-radius: 16px;
      color: #cbd5e1;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s, transform 0.1s;
    }
    .reset-btn:active {
      background: #1e293b;
      border-color: #64748b;
      color: #f8fafc;
      transform: scale(0.95);
    }

    .wind-info-text, .dow-info-text, .temp-info-text {
      font-size: clamp(0.7rem, 2vw, 0.75rem);
      color: #94a3b8;
      text-align: center;
      margin-top: 4px;
      line-height: 1.4;
    }
    .wind-alert { color: #f87171; font-weight: 600; }
    .dow-alert { color: #fbbf24; font-weight: 600; margin-top: 4px; display: block; }
    
    /* Детали расчета в DOW */
    .calc-details {
      text-align: left;
      background: #1e293b;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: clamp(0.7rem, 2vw, 0.75rem);
      border: 1.5px solid #334155;
      transition: all 0.3s ease;
    }
    .calc-details div { margin-bottom: 6px; display: flex; justify-content: space-between; }
    .calc-details div:last-child { margin-bottom: 0; border-top: 1px solid #334155; padding-top: 6px; font-weight: bold; color: #f8fafc;}
    
    /* Синяя подсветка для блока деталей */
    .calc-details.active {
      border-color: #3b82f6;
      background: #0f2946;
      box-shadow: 0 0 0 1.5px #3b82f6, 0 4px 12px -4px rgba(59, 130, 246, 0.3);
    }

    /* Стили для Temp Corr */
    .tc-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
      background: #1e293b;
      padding: 8px;
      border-radius: 12px;
      border: 1.5px solid #334155;
      width: 100%;
      scroll-margin-top: 20px;
    }
    .tc-group label {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
      padding-left: 4px;
      font-weight: 600;
    }
    .tc-input-group {
      display: flex;
      gap: 8px;
      align-items: stretch;
      width: 100%;
    }
    
    .tc-input-group input {
      flex: 1;
      padding: 10px 12px;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      border-radius: 8px;
      height: 44px;
      text-align: right;
      background: #1e293b;
      border: 1.5px solid #334155;
      color: #f8fafc;
      font-weight: 600;
      outline: none;
      font-variant-numeric: tabular-nums;
      transition: all 0.2s;
    }
    .tc-input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }
    .tc-input-group input::placeholder {
      color: #475569;
      font-weight: 400;
    }
    
    .tc-final-value {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f2946;
      border: 1.5px solid #c8102e;
      border-radius: 8px;
      padding: 0 12px;
      font-size: clamp(1rem, 3vw, 1.15rem);
      font-weight: 800;
      color: #ef4444;
      height: 44px;
      box-shadow: 0 0 0 1.5px #3b82f6;
      transition: all 0.3s ease;
      text-align: center;
    }
    .tc-final-value.empty {
      color: #475569;
      border-color: #334155;
      box-shadow: none;
      background: #1e293b;
    }

    .tc-badges {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .tc-badge {
      flex: 1;
      font-size: clamp(0.6rem, 2vw, 0.65rem);
      padding: 4px;
      border-radius: 6px;
      text-align: center;
      border: 1px solid #3b82f6;
      color: #93c5fd;
      background: #0f2946;
      transition: all 0.3s ease;
    }
    .tc-badge.active {
      border-color: #22c55e;
      color: #bbf7d0;
      background: #0a3d1f;
    }

    /* === АДАПТИВНОСТЬ ДЛЯ ПЛАНШЕТОВ === */
    @media (min-width: 768px) {
      .app {
        max-width: 900px;
        padding: 30px 40px;
        gap: 20px;
      }
      
      .input-grid {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .input-row {
        gap: 16px;
      }
      
      .field input, .field select {
        padding: 18px 20px;
      }

      #main-temp.active {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        align-items: start;
      }
      #main-temp .tc-group:nth-child(n+3) {
        grid-column: span 1;
      }
      #main-temp .divider {
        grid-column: span 2;
      }
      #main-temp #tcFieldTemp,
      #main-temp #tcFieldElev {
        grid-column: span 1;
      }
      #main-temp #tcInfo {
        grid-column: span 2;
      }
      #main-temp .reset-btn {
        grid-column: span 2;
      }
    }

    @media (min-width: 1200px) {
      .app {
        max-width: 1100px;
      }
      #main-temp.active {
        grid-template-columns: 1fr 1fr 1fr;
      }
      #main-temp #tcFieldTemp,
      #main-temp #tcFieldElev,
      #main-temp .divider,
      #main-temp #tcInfo,
      #main-temp .reset-btn {
        grid-column: span 3;
      }
      #main-temp .tc-group:nth-child(n+3) {
        grid-column: span 1;
      }
    }

    /* Горизонтальная ориентация на телефонах */
    @media (max-height: 600px) and (orientation: landscape) and (max-width: 767px) {
      .app { padding-top: 8px; gap: 8px; }
      .header { flex-direction: row; justify-content: space-between; padding: 0; gap: 12px; }
      .title-badge { padding: 10px 16px; }
      .title-main { font-size: 1.1rem; }
      .field input, .field select { padding: 10px 14px; font-size: 1rem; }
      .reset-btn { padding: 10px 14px; }
      .tc-input-group input { height: 40px; font-size: 0.9rem; }
      .tc-final-value { height: 40px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="app" id="appContainer">
    <div class="header">
      <div class="title-badge">
        <div class="title-main">AVIA <span class="accent">CALCULATOR</span></div>
        <div class="title-sub">AZUR AIR</div>
      </div>
      <div class="credit">by Denis Gorelskii</div>
    </div>

    <!-- ГЛАВНЫЕ ВКЛАДКИ -->
    <div class="main-tabs">
      <button class="main-tab-btn active" id="btnMainFuel" onclick="switchMainTab('main-fuel', this)">Fuel</button>
      <button class="main-tab-btn" id="btnMainDow" onclick="switchMainTab('main-dow', this)">DOW/DOI</button>
      <button class="main-tab-btn" id="btnMainWind" onclick="switchMainTab('main-wind', this)">Wind</button>
      <button class="main-tab-btn" id="btnMainTemp" onclick="switchMainTab('main-temp', this)">Temp</button>
    </div>

    <!-- ==================== FUEL ==================== -->
    <div id="main-fuel" class="main-tab-content active">
      <div class="sub-tabs">
        <button class="sub-tab-btn active" id="btnTab1" onclick="switchSubTab('tab1', this)">Одно требование</button>
        <button class="sub-tab-btn" id="btnTab2" onclick="switchSubTab('tab2', this)">Два требования</button>
      </div>

      <div id="fuelSwipeArea">
        <!-- Fuel 1 -->
        <div id="tab1" class="sub-tab-content active">
          <div class="field">
            <label for="remainingFuel">REMAINING FUEL (Kg)</label>
            <input type="number" id="remainingFuel" step="1" min="0" inputmode="decimal" placeholder="">
          </div>
          <div class="field field-green" id="fieldFuelUsed">
            <label for="fuelUsed">MAINT FUEL USED (Kg)</label>
            <input type="text" id="fuelUsed" readonly placeholder="" tabindex="-1">
          </div>
          <div class="field field-green" id="fieldBefore">
            <label for="before">BEFORE UPLIFT (kg)</label>
            <input type="text" id="before" readonly placeholder="" tabindex="-1">
          </div>
          <div class="input-grid">
            <div class="field" id="fieldAddedLt">
              <label for="addedLt">ADDED (Lt)</label>
              <input type="number" id="addedLt" step="0.1" min="0" inputmode="decimal" placeholder="">
            </div>
            <div class="field" id="fieldDensity">
              <label for="density">DENSITY</label>
              <input type="text" id="density" inputmode="decimal" placeholder="" autocomplete="off">
            </div>
            <div class="field" id="fieldAddedKg">
              <label for="addedKg">ADDED (Kg)</label>
              <input type="text" id="addedKg" readonly placeholder="" tabindex="-1">
            </div>
            <div class="field" id="fieldIndicated">
              <label for="indicatedTotal">INDICATED TOTAL (Kg)</label>
              <input type="number" id="indicatedTotal" step="1" min="0" inputmode="decimal" placeholder="">
            </div>
          </div>
          <hr class="divider">
          <button type="button" class="reset-btn" onclick="resetSingle()">Сброс</button>
        </div>

        <!-- Fuel 2 -->
        <div id="tab2" class="sub-tab-content">
          <div class="field">
            <label for="remainingFuel2">REMAINING FUEL (Kg)</label>
            <input type="number" id="remainingFuel2" step="1" min="0" inputmode="decimal" placeholder="">
          </div>
          <div class="field field-green" id="fieldFuelUsed2">
            <label for="fuelUsed2">MAINT FUEL USED (Kg)</label>
            <input type="text" id="fuelUsed2" readonly placeholder="" tabindex="-1">
          </div>
          <div class="field field-green" id="fieldBefore2">
            <label for="before2">BEFORE UPLIFT (kg)</label>
            <input type="text" id="before2" readonly placeholder="" tabindex="-1">
          </div>
          <div class="input-grid">
            <div class="field" id="fieldAddedLt2">
              <label for="addedLt2">1. ADDED (Lt)</label>
              <input type="number" id="addedLt2" step="0.1" min="0" inputmode="decimal" placeholder="">
            </div>
            <div class="field" id="fieldAddedLt2b">
              <label for="addedLt2b">2. ADDED (Lt)</label>
              <input type="number" id="addedLt2b" step="0.1" min="0" inputmode="decimal" placeholder="">
            </div>
            <div class="field" id="fieldDensity2">
              <label for="density2">1. DENSITY</label>
              <input type="text" id="density2" inputmode="decimal" placeholder="" autocomplete="off">
            </div>
            <div class="field" id="fieldDensity2b">
              <label for="density2b">2. DENSITY</label>
              <input type="text" id="density2b" inputmode="decimal" placeholder="" autocomplete="off">
            </div>
          </div>
          <div class="field" id="fieldAddedKg2">
            <label for="addedKg2">ADDED (Kg)</label>
            <input type="text" id="addedKg2" readonly placeholder="" tabindex="-1">
          </div>
          <div class="field" id="fieldIndicated2">
            <label for="indicatedTotal2">INDICATED TOTAL (Kg)</label>
            <input type="number" id="indicatedTotal2" step="1" min="0" inputmode="decimal" placeholder="">
          </div>
          <hr class="divider">
          <button type="button" class="reset-btn" onclick="resetDouble()">Сброс</button>

      </div>
    </div>

    <!-- ==================== DOW/DOI ==================== -->

    <!-- ==================== WIND ==================== -->
    <div id="main-wind" class="main-tab-content">
      <div class="input-grid">

        </div>
        <div class="field" id="wFieldMu">
          <label for="wMu">Measured Braking Coeff (MBC)</label>
          <input type="number" id="wMu" step="0.01" min="0" max="1" inputmode="decimal" placeholder="">
        </div>

      </div>

      <div class="divider"></div>

      <div class="tc-group">
        <label for="tcIaf">IAF (ft)</label>
        <div class="tc-input-group">
          <input type="number" id="tcIaf" inputmode="decimal" placeholder="Published Alt" oninput="calculateTemp()">
          <div class="tc-final-value empty" id="tcIafFinal">—</div>

        <label for="tcFaf">FAF (ft)</label>
        <div class="tc-input-group">
          <input type="number" id="tcFaf" inputmode="decimal" placeholder="Published Alt" oninput="calculateTemp()">
          <div class="tc-final-value empty" id="tcFafFinal">—</div>
        </div>
        <div class="tc-badges">
          <div class="tc-badge" id="tcFafHeight">Height: —</div>
          <div class="tc-badge" id="tcFafCorr">Corr: 0 ft</div>
        </div>
      </div>

      <div class="tc-group">
        <label for="tcStep">Step-down (ft)</label>
        <div class="tc-input-group">
          <input type="number" id="tcStep" inputmode="decimal" placeholder="Published Alt" oninput="calculateTemp()">
          <div class="tc-final-value empty" id="tcStepFinal">—</div>
        </div>
        <div class="tc-badges">
          <div class="tc-badge" id="tcStepHeight">Height: —</div>
          <div class="tc-badge" id="tcStepCorr">Corr: 0 ft</div>
        </div>
      </div>

      <div class="tc-group">
        <label for="tcMda">MDA / DA (ft)</label>
        <div class="tc-input-group">
          <input type="number" id="tcMda" inputmode="decimal" placeholder="Published Alt" oninput="calculateTemp()">
          <div class="tc-final-value empty" id="tcMdaFinal">—</div>
        </div>
        <div class="tc-badges">
          <div class="tc-badge" id="tcMdaHeight">Height: —</div>
          <div class="tc-badge" id="tcMdaCorr">Corr: 0 ft</div>
        </div>
      </div>

      <div class="tc-group">
        <label for="tcMissed">Missed Approach (ft)</label>
        <div class="tc-input-group">
          <input type="number" id="tcMissed" inputmode="decimal" placeholder="Published Alt" oninput="calculateTemp()">
          <div class="tc-final-value empty" id="tcMissedFinal">—</div>
        </div>
        <div class="tc-badges">
          <div class="tc-badge" id="tcMissedHeight">Height: —</div>
          <div class="tc-badge" id="tcMissedCorr">Corr: 0 ft</div>
        </div>
      </div>

      <div id="tcInfo" class="temp-info-text">Введите температуру, высоту аэродрома и высоты для расчета.</div>
      <hr class="divider">
      <button type="button" class="reset-btn" onclick="resetTemp()">Сброс</button>
    </div>

  </div>

  <!-- Скрипты -->
  <script>
    // === PWA / OFFLINE ===
    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'avia-calc-v1';
        self.addEventListener('install', (e) => { self.skipWaiting(); });
        self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    }

    const manifest = {
      name: "AVIA CALCULATOR",
      short_name: "AVIA CALC",
      start_url: ".",
      display: "standalone",
      background_color: "#0f172a",
      theme_color: "#0f172a",
      icons: [{
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a2a43'/%3E%3Crect x='0' y='0' width='100' height='14' fill='%23c8102e'/%3E%3Ctext x='50' y='52' font-family='Arial, sans-serif' font-size='24' font-weight='900' fill='%23ffffff' text-anchor='middle' letter-spacing='0'%3EAVIA%3C/text%3E%3Ctext x='50' y='75' font-family='Arial, sans-serif' font-size='12' font-weight='700' fill='%2393c5fd' text-anchor='middle' letter-spacing='0'%3ECALCULATOR%3C/text%3E%3C/svg%3E",
        sizes: "100x100",
        type: "image/svg+xml"
      }]
    };
    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
    const manifestUrl = URL.createObjectURL(manifestBlob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestUrl;
    document.head.appendChild(link);

    // === ОСНОВНАЯ ЛОГИКА ===

    function switchMainTab(tabId, btnElement) {
      document.querySelectorAll('.main-tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.main-tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (btnElement) btnElement.classList.add('active');
    }

    let currentSubTab = 'tab1';
    function switchSubTab(tabId, btnElement) {
      currentSubTab = tabId;
      document.querySelectorAll('.sub-tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.querySelectorAll('.sub-tab-btn').forEach(el => el.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');
    }

    let touchStartX = 0, touchEndX = 0;
    const fuelSwipeArea = document.getElementById('fuelSwipeArea');
    fuelSwipeArea.addEventListener('touchstart', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      touchStartX = e.changedTouches[0].screenX;
    }, {passive: true});
    fuelSwipeArea.addEventListener('touchend', e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      const tabs = ['tab1', 'tab2'];
      let idx = tabs.indexOf(currentSubTab);
      if (diff < -50 && idx < tabs.length - 1) switchSubTab(tabs[idx + 1], document.getElementById(tabs[idx + 1] === 'tab1' ? 'btnTab1' : 'btnTab2'));
      else if (diff > 50 && idx > 0) switchSubTab(tabs[idx - 1], document.getElementById(tabs[idx - 1] === 'tab1' ? 'btnTab1' : 'btnTab2'));
    }, {passive: true});

    // Fuel
    function num(el) { const v = parseFloat(el.value); return isNaN(v) || !isFinite(v) ? 0 : v; }
    function rnd(val) { const n = parseFloat(val); return isNaN(n) || !isFinite(n) ? 0 : Math.round(n); }
    function isFilled(el) { const s = el.value.trim(); return s !== '' && !isNaN(parseFloat(s)); }
    function has5Chars(el) { return el.value.trim().length === 5; }
    function normalizeDensity(raw) {
      let s = raw.replace(',', '.').replace(/[^0-9.]/g, '');
      if (s.startsWith('.')) s = '0' + s;
      const firstDot = s.indexOf('.');
      if (firstDot !== -1) s = s.slice(0, firstDot + 1) + s.slice(firstDot + 1).replace(/\./g, '');
      return s;
    }

    // Fuel 1
    const remainingFuelInput = document.getElementById('remainingFuel');
    const beforeInput = document.getElementById('before');
    const addedLtInput = document.getElementById('addedLt');
    const densityInput = document.getElementById('density');
    const addedKgInput = document.getElementById('addedKg');
    const indicatedTotalInput = document.getElementById('indicatedTotal');
    const fuelUsedInput = document.getElementById('fuelUsed');
    const fieldFuelUsed = document.getElementById('fieldFuelUsed');
    const fieldBefore = document.getElementById('fieldBefore');
    const fieldAddedLt = document.getElementById('fieldAddedLt');
    const fieldDensity = document.getElementById('fieldDensity');
    const fieldAddedKg = document.getElementById('fieldAddedKg');
    const fieldIndicated = document.getElementById('fieldIndicated');

    densityInput.addEventListener('input', () => {
      const normalized = normalizeDensity(densityInput.value);
      if (normalized !== densityInput.value) densityInput.value = normalized;
      calculateSingle();
    });

    function calculateSingle() {
      const addedLt = num(addedLtInput), density = num(densityInput), indicated = num(indicatedTotalInput), remaining = num(remainingFuelInput);
      const addedKg = addedLt * density;
      const allFilled = isFilled(remainingFuelInput) && isFilled(addedLtInput) && isFilled(densityInput) && has5Chars(indicatedTotalInput);
      
      addedKgInput.value = addedLt === 0 || density === 0 ? '' : String(rnd(addedKg));
      [fieldFuelUsed, fieldBefore, fieldAddedLt, fieldDensity, fieldAddedKg, fieldIndicated].forEach(f => f.classList.remove('field-green-active', 'field-blue-active'));

      if (!allFilled) { fuelUsedInput.value = ''; beforeInput.value = ''; return; }
      const fuelUsed = Math.abs(rnd(indicated - (addedKg + remaining)));
      const before = rnd(remaining - fuelUsed);
      fuelUsedInput.value = String(fuelUsed);
      beforeInput.value = String(before);
      
      fieldFuelUsed.classList.add('field-green-active');
      [fieldBefore, fieldAddedLt, fieldDensity, fieldAddedKg, fieldIndicated].forEach(f => f.classList.add('field-blue-active'));
    }

    function resetSingle() {
      [remainingFuelInput, addedLtInput, densityInput, indicatedTotalInput].forEach(el => el.value = '');
      fuelUsedInput.value = ''; beforeInput.value = ''; addedKgInput.value = '';
      [fieldFuelUsed, fieldBefore, fieldAddedLt, fieldDensity, fieldAddedKg, fieldIndicated].forEach(f => f.classList.remove('field-green-active', 'field-blue-active'));
      remainingFuelInput.focus();
    }
    [remainingFuelInput, addedLtInput, indicatedTotalInput].forEach(input => input.addEventListener('input', calculateSingle));

    // Fuel 2
    const remainingFuelInput2 = document.getElementById('remainingFuel2');
    const beforeInput2 = document.getElementById('before2');
    const addedLtInput2 = document.getElementById('addedLt2');
    const densityInput2 = document.getElementById('density2');
    const addedLtInput2b = document.getElementById('addedLt2b');
    const densityInput2b = document.getElementById('density2b');
    const addedKgInput2 = document.getElementById('addedKg2');
    const indicatedTotalInput2 = document.getElementById('indicatedTotal2');
    const fuelUsedInput2 = document.getElementById('fuelUsed2');
    const fieldFuelUsed2 = document.getElementById('fieldFuelUsed2');
    const fieldBefore2 = document.getElementById('fieldBefore2');
    const fieldAddedLt2 = document.getElementById('fieldAddedLt2');
    const fieldDensity2 = document.getElementById('fieldDensity2');
    const fieldAddedLt2b = document.getElementById('fieldAddedLt2b');
    const fieldDensity2b = document.getElementById('fieldDensity2b');
    const fieldAddedKg2 = document.getElementById('fieldAddedKg2');
    const fieldIndicated2 = document.getElementById('fieldIndicated2');

    function bindDensity(inputEl, calcFn) {
      inputEl.addEventListener('input', () => {
        const normalized = normalizeDensity(inputEl.value);
        if (normalized !== inputEl.value) inputEl.value = normalized;
        calcFn();
      });
    }
    bindDensity(densityInput2, calculateDouble);
    bindDensity(densityInput2b, calculateDouble);

    function calculateDouble() {
      const addedLt1 = num(addedLtInput2), density1 = num(densityInput2), addedLt2 = num(addedLtInput2b), density2 = num(densityInput2b);
      const indicated = num(indicatedTotalInput2), remaining = num(remainingFuelInput2);
      const addedKg = (addedLt1 * density1) + (addedLt2 * density2);
      const allFilled = isFilled(remainingFuelInput2) && isFilled(addedLtInput2) && isFilled(densityInput2) && isFilled(addedLtInput2b) && isFilled(densityInput2b) && has5Chars(indicatedTotalInput2);
      
      addedKgInput2.value = addedKg === 0 ? '' : String(rnd(addedKg));
      [fieldFuelUsed2, fieldBefore2, fieldAddedLt2, fieldDensity2, fieldAddedLt2b, fieldDensity2b, fieldAddedKg2, fieldIndicated2].forEach(f => f.classList.remove('field-green-active', 'field-blue-active'));

      if (!allFilled) { fuelUsedInput2.value = ''; beforeInput2.value = ''; return; }
      const fuelUsed = Math.abs(rnd(indicated - (addedKg + remaining)));
      const before = rnd(remaining - fuelUsed);
      fuelUsedInput2.value = String(fuelUsed);
      beforeInput2.value = String(before);
      
      fieldFuelUsed2.classList.add('field-green-active');
      [fieldBefore2, fieldAddedLt2, fieldDensity2, fieldAddedLt2b, fieldDensity2b, fieldAddedKg2, fieldIndicated2].forEach(f => f.classList.add('field-blue-active'));
    }

    function resetDouble() {
      [remainingFuelInput2, addedLtInput2, densityInput2, addedLtInput2b, densityInput2b, indicatedTotalInput2].forEach(el => el.value = '');
      fuelUsedInput2.value = ''; beforeInput2.value = ''; addedKgInput2.value = '';
      [fieldFuelUsed2, fieldBefore2, fieldAddedLt2, fieldDensity2, fieldAddedLt2b, fieldDensity2b, fieldAddedKg2, fieldIndicated2].forEach(f => f.classList.remove('field-green-active', 'field-blue-active'));
      remainingFuelInput2.focus();
    }
    [remainingFuelInput2, addedLtInput2, addedLtInput2b, indicatedTotalInput2].forEach(input => input.addEventListener('input', calculateDouble));

    // Wind
    const KT_TO_MS = 0.514444, LIMIT_TAILWIND_KT = 10;
    const TABLE = [
      { code: 6, action: "—", muMin: 0.62, muMax: 9.99, limitKt: 40, limitMs: 20.5 },
      { code: 5, action: "Good", muMin: 0.40, muMax: 0.61, limitKt: 40, limitMs: 20.5 },
      { code: 4, action: "Good to Medium", muMin: 0.36, muMax: 0.39, limitKt: 35, limitMs: 18.0 },
      { code: 3, action: "Medium", muMin: 0.30, muMax: 0.35, limitKt: 25, limitMs: 12.8 },
      { code: 2, action: "Medium to Poor", muMin: 0.26, muMax: 0.29, limitKt: 17, limitMs: 8.7 },
      { code: 1, action: "Poor", muMin: 0.17, muMax: 0.25, limitKt: 15, limitMs: 7.7 },
      { code: 0, action: "Nil", muMin: -1, muMax: 0.169, limitKt: 0, limitMs: 0 }
    ];
    const wDir = document.getElementById('wDir'), wRwy = document.getElementById('wRwy'), wSpd = document.getElementById('wSpd'), wGust = document.getElementById('wGust'), wUnit = document.getElementById('wUnit'), wMu = document.getElementById('wMu');
    const wCross = document.getElementById('wCross'), wLong = document.getElementById('wLong'), wInfo = document.getElementById('wInfo');
    const wFieldCross = document.getElementById('wFieldCross'), wFieldLong = document.getElementById('wFieldLong');

    function calculateWind() {
      const dirVal = wDir.value, rwyVal = wRwy.value, spdVal = wSpd.value, gustVal = wGust.value, muVal = wMu.value;
      wFieldCross.classList.remove('field-green-active', 'field-red-active');
      wFieldLong.classList.remove('field-green-active', 'field-red-active');

      if (dirVal === '' || rwyVal === '' || spdVal === '') {
        wCross.value = ''; wLong.value = ''; wInfo.innerHTML = 'Введите данные для расчета.'; return;
      }
      const dir = parseFloat(dirVal) || 0, spdAvg = parseFloat(spdVal) || 0, rwy = parseFloat(rwyVal) || 0;
      let spdGust = parseFloat(gustVal); if (isNaN(spdGust)) spdGust = 0;
      
      const effectiveSpd = (spdGust > spdAvg) ? spdGust : spdAvg;
      const isGustUsed = effectiveSpd > spdAvg;
      const spdKt = wUnit.value === 'kt' ? effectiveSpd : effectiveSpd / KT_TO_MS;
      const spdMs = wUnit.value === 'ms' ? effectiveSpd : effectiveSpd * KT_TO_MS;
      
      let delta = (dir - rwy + 360) % 360; if (delta > 180) delta -= 360;
      const rad = delta * Math.PI / 180;
      const crossKt = Math.abs(spdKt * Math.sin(rad)), crossMs = Math.abs(spdMs * Math.sin(rad));
      const longKt = spdKt * Math.cos(rad), longMs = spdMs * Math.cos(rad);
      
      wCross.value = `${crossMs.toFixed(1)} m/s / ${crossKt.toFixed(1)} kt`;
      wLong.value = `${Math.abs(longMs).toFixed(1)} m/s / ${Math.abs(longKt).toFixed(1)} kt (${longKt >= 0 ? 'Head' : 'Tail'})`;

      if (muVal === '') {
        wInfo.innerHTML = isGustUsed ? `Gust used: ${effectiveSpd} ${wUnit.value === 'ms' ? 'm/s' : 'kt'}. Enter MBC to verify.` : 'Enter MBC to verify by table.'; return;
      }
      const mu = parseFloat(muVal);
      const row = TABLE.find(r => mu >= r.muMin && mu <= r.muMax) || TABLE[TABLE.length - 1];
      
      const failCross = crossKt > row.limitKt, failTail = longKt < -LIMIT_TAILWIND_KT, isNil = row.code === 0, isFail = failCross || failTail || isNil;
      if (isFail) { wFieldCross.classList.add('field-red-active'); wFieldLong.classList.add('field-red-active'); }
      else { wFieldCross.classList.add('field-green-active'); wFieldLong.classList.add('field-green-active'); }

      let infoHtml = `Runway Code: <b>${row.code} (${row.action})</b><br>Crosswind Limit: <b>${row.limitMs} m/s / ${row.limitKt} kt</b>`;
      if (isGustUsed) infoHtml += `<br><span style="color:#3b82f6;">Gust used: ${effectiveSpd} ${wUnit.value === 'ms' ? 'm/s' : 'kt'}</span>`;
      if (isNil) infoHtml += `<br><span class="wind-alert">WARNING: MBC < 0.17 (Nil). Landing prohibited!</span>`;
      else if (failCross) infoHtml += `<br><span class="wind-alert">WARNING: Crosswind exceeds limit!</span>`;
      if (failTail) infoHtml += `<br><span class="wind-alert">WARNING: Tailwind > ${LIMIT_TAILWIND_KT} kt!</span>`;
      wInfo.innerHTML = infoHtml;
    }
    function resetWind() { [wDir, wRwy, wSpd, wGust, wMu].forEach(el => el.value = ''); wUnit.value = 'ms'; calculateWind(); }
    [wDir, wRwy, wSpd, wGust, wMu].forEach(input => input.addEventListener('input', calculateWind));
    wUnit.addEventListener('change', calculateWind);

    function populateCrewCodes() {
      const reg = dowRegSelect.value;
      
      dowCrewSelect.innerHTML = '<option value="" disabled selected>Выберите код...</option>';
      dowPantrySelect.innerHTML = '<option value="" disabled selected>Выберите код...</option>';

      dowInfo.className = 'dow-info-text';
      dowFieldDow.classList.remove('field-green-active');
      dowFieldDoi.classList.remove('field-green-active');

      if (!reg) return;
      const data = DOW_DATA[reg];

      Object.keys(data.crews).sort().forEach(code => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = code;
        dowCrewSelect.appendChild(opt);
      });

      Object.keys(data.pantry).sort().forEach(code => {
        const opt = document.createElement('option');
        opt.value = code; opt.textContent = code;
        dowPantrySelect.appendChild(opt);
      });
    }

    function calculateDow() {
      const reg = dowRegSelect.value;
      const crew = dowCrewSelect.value;
      const pantry = dowPantrySelect.value;
      const factFlyawayStr = dowFlyawayInput.value.trim();

      if (!reg || !crew || !pantry) return;

      const data = DOW_DATA[reg];
      const baseData = data.crews[crew];
      const pantryData = data.pantry[pantry];

      let finalDow = baseData.dow;
      let finalDoi = baseData.doi;
      
      finalDow += pantryData.kg;
      finalDoi += pantryData.iu;

      let flyawayWeightDiff = 0;
      let flyawayIuDiff = 0;
      let factWeight = 0;
      
      if (factFlyawayStr !== '') {
        factWeight = parseFloat(factFlyawayStr) || 0;
        flyawayWeightDiff = factWeight - data.stdFlyaway;
        
        finalDow += flyawayWeightDiff;
        
        const iuPerKg = data.iuFactor / data.stdFlyaway;
        flyawayIuDiff = flyawayWeightDiff * iuPerKg * -1;
        
        finalDoi += flyawayIuDiff;
      }

      finalDow = Math.round(finalDow);
      finalDoi = Math.round(finalDoi * 100) / 100;

      dowValInput.value = String(finalDow);
      doiValInput.value = finalDoi.toFixed(2);
      dowConfigInput.value = data.config;

      dowFieldDow.classList.add('field-green-active');
      dowFieldDoi.classList.add('field-green-active');

      let details = `<div class="calc-details active">`;
      details += `<div><span>Base DOW</span><span>${baseData.dow} kg</span></div>`;
      details += `<div><span>Pantry (${pantry})</span><span>${pantryData.kg > 0 ? '+' : ''}${pantryData.kg} kg</span></div>`;
      
      if (factFlyawayStr !== '') {
        details += `<div><span>Fly-away (${factWeight} - ${data.stdFlyaway})</span><span>${flyawayWeightDiff > 0 ? '+' : ''}${flyawayWeightDiff} kg</span></div>`;
      }
      
      details += `<div><span>ИТОГО DOW</span><span>${finalDow} kg</span></div>`;
      details += `<br>`;
      details += `<div><span>Base DOI</span><span>${baseData.doi.toFixed(2)}</span></div>`;
      details += `<div><span>Pantry (${pantry})</span><span>${pantryData.iu > 0 ? '+' : ''}${pantryData.iu.toFixed(2)}</span></div>`;
      
      if (factFlyawayStr !== '') {
        details += `<div><span>Fly-away</span><span>${flyawayIuDiff > 0 ? '+' : ''}${flyawayIuDiff.toFixed(2)}</span></div>`;
      }
      
      details += `<div><span>ИТОГО DOI</span><span>${finalDoi.toFixed(2)}</span></div>`;
      details += `<br><div><span>%MAC</span><span>${baseData.mac.toFixed(2)}</span></div>`;
      details += `</div>`;

      let info = details;
      if (crew === "2/1*") {
        info += `<span class="dow-alert">* Данные включают буфетную тележку O (для ferry flight)</span>`;
      }
      
      dowInfo.innerHTML = info;
      dowInfo.className = '';
    }

          numPart = numPart.slice(0, firstDot + 1) + numPart.slice(firstDot + 1).replace(/\./g, '');
        }
        tcTempInput.value = '-' + numPart;
      }
      
      calculateTemp();
    }

    function interpolateTemp(temp, height) {
      let t = Math.max(-50, Math.min(0, temp));
      let h = Math.max(200, Math.min(3000, height));

      let tIdx1 = 0, tIdx2 = 0, tWeight = 0;
      for (let i = 0; i < TEMP_TABLE.temps.length - 1; i++) {
        if (t <= TEMP_TABLE.temps[i] && t >= TEMP_TABLE.temps[i+1]) {
          tIdx1 = i; tIdx2 = i+1;
          tWeight = (t - TEMP_TABLE.temps[i]) / (TEMP_TABLE.temps[i+1] - TEMP_TABLE.temps[i]);
          break;
        }
      }
      if (t <= -50) { tIdx1 = 5; tIdx2 = 5; tWeight = 0; }

      let hIdx1 = 0, hIdx2 = 0, hWeight = 0;
      for (let i = 0; i < TEMP_TABLE.heights.length - 1; i++) {
        if (h >= TEMP_TABLE.heights[i] && h <= TEMP_TABLE.heights[i+1]) {
          hIdx1 = i; hIdx2 = i+1;
          hWeight = (h - TEMP_TABLE.heights[i]) / (TEMP_TABLE.heights[i+1] - TEMP_TABLE.heights[i]);
          break;
        }
      }
      if (h >= 3000) { hIdx1 = TEMP_TABLE.heights.length - 1; hIdx2 = hIdx1; hWeight = 0; }

      const v00 = TEMP_TABLE.data[tIdx1][hIdx1];
      const v01 = TEMP_TABLE.data[tIdx1][hIdx2];
      const v10 = TEMP_TABLE.data[tIdx2][hIdx1];
      const v11 = TEMP_TABLE.data[tIdx2][hIdx2];

      const top = v00 + (v01 - v00) * hWeight;
      const bot = v10 + (v11 - v10) * hWeight;
      const result = top + (bot - top) * tWeight;

      return Math.round(result);
    }

    function calculateTemp() {
      const tempVal = tcTempInput.value.trim();
      const elevVal = tcElevInput.value.trim();

      Object.values(tcBadges).forEach(b => {
        b.h.textContent = 'Height: —';
        b.h.classList.remove('active');
        b.c.textContent = 'Corr: 0 ft';
        b.c.classList.remove('active');
        b.f.textContent = '—';
        b.f.classList.add('empty');
      });

      if (tempVal === '' || tempVal === '-') {
        tcInfo.innerHTML = 'Введите температуру.';
        tcInfo.className = 'temp-info-text';
        return;
      }

      const temp = parseFloat(tempVal);
      if (isNaN(temp)) {
        tcInfo.innerHTML = 'Некорректная температура.';
        tcInfo.className = 'temp-info-text';
        return;
      }

      if (temp >= 0) {
        tcInfo.innerHTML = 'Температура 0°C и выше. Поправка не требуется.';
        tcInfo.className = 'temp-info-text';
        return;
      }

      if (elevVal === '') {
        tcInfo.innerHTML = 'Введите высоту аэродрома.';
        tcInfo.className = 'temp-info-text';
        return;
      }
      
      const elev = parseFloat(elevVal) || 0;
      let hasValues = false;

      Object.keys(tcInputs).forEach(key => {
        const input = tcInputs[key];
        const badge = tcBadges[key];
        const val = input.value.trim();

        if (val !== '') {
          const publishedAlt = parseFloat(val) || 0;
          const height = publishedAlt - elev;
          
          if (height > 0) {
            badge.h.textContent = `Height: ${Math.round(height)} ft`;
            badge.h.classList.add('active');
            
            const corr = interpolateTemp(temp, height);
            badge.c.textContent = `Corr: +${corr} ft`;
            badge.c.classList.add('active');
            
            const finalAlt = publishedAlt + corr;
            badge.f.textContent = `${finalAlt} ft`;
            badge.f.classList.remove('empty');
            hasValues = true;
          }
        }
      });

      if (hasValues) {
        tcInfo.innerHTML = `Поправка для температуры ${temp}°C (высота аэродрома ${elev} ft).`;
        tcInfo.className = 'temp-info-text';
      } else {
        tcInfo.innerHTML = 'Введите опубликованные высоты (больше высоты аэродрома).';
        tcInfo.className = 'temp-info-text';
      }
    }

    function resetTemp() {
      tcTempInput.value = '-';
      tcElevInput.value = '';
      Object.values(tcInputs).forEach(input => input.value = '');
      calculateTemp();
    }

    tcTempInput.addEventListener('input', handleTempInput);
    tcElevInput.addEventListener('input', calculateTemp);
    Object.values(tcInputs).forEach(input => input.addEventListener('input', calculateTemp));

    // Инициализация
    initDowSelect();
    resetWind();
    calculateWind();
    resetSingle();
    resetDouble();
    resetDow();
    resetTemp();

  </script>
</body>
